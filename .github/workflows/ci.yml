name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request supersedes this run; a branch's runs
# queue instead.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.3
      - name: Bundle
        run: node bundle.mjs
      - name: Valid JSON, one entry per directory
        run: |
          node - <<'EOF'
            const fs = require("fs");
            const ex = JSON.parse(fs.readFileSync("examples.json", "utf8"));
            const dirs = fs.readdirSync(".", { withFileTypes: true })
              .filter(d => d.isDirectory() && !d.name.startsWith("."))
              .map(d => d.name).sort();
            const ids = ex.map(e => e.id).sort();
            if (JSON.stringify(dirs) !== JSON.stringify(ids)) {
              throw new Error(`dirs ${dirs} != bundled ${ids}`);
            }
            for (const e of ex) {
              if (!e.title || !e.blurb || !e.files.length) throw new Error(`${e.id}: incomplete`);
              if (!e.files.some(f => f.name === e.entry)) throw new Error(`${e.id}: entry missing`);
            }
            console.log(`ok — ${ex.length} examples`);
          EOF
